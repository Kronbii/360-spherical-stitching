name: Bug report
description: Report a reproducible bug in panorama stitching or related tooling.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report.
        Please provide enough detail for maintainers to reproduce the problem.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: A concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Include exact commands and files/config used.
      placeholder: |
        1. Run `python run.py config.yaml`
        2. ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Screenshots
      description: Paste relevant logs/tracebacks and attach images if useful.
      render: shell
    validations:
      required: false

  - type: textarea
    id: input_details
    attributes:
      label: Input Details
      description: Share input characteristics (photo count, resolution, video metadata, etc).
      placeholder: Number of images, dimensions, phone model, overlap quality, motion blur...
    validations:
      required: false

  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: e.g., 3.12.1
    validations:
      required: true

  - type: input
    id: opencv_version
    attributes:
      label: OpenCV Version
      placeholder: e.g., 4.9.0
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g., Ubuntu 24.04, macOS 15.0, Windows 11
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this bug with the latest code on `main`.
          required: false
